name: Retro Mega Neo
author: Hazem Abdelghani
version: 1.1.0
summary:
  A fast, clean theme for handhelds, desktops and TVs, with four display modes and touch, mouse and gamepad control.
description:
  Retro Mega Neo is a clean, modern theme built for small and large screens alike. Browse in four display modes (List, Sidebar, Grid and Gallery), choose from ten color themes, swipe or scroll through your library. It works with a touchscreen, a mouse and keyboard, or a gamepad, with button legends for Switch, Xbox and PlayStation pads. Original design by DJFumberger, rewritten from scratch with new features by plaidman, and further developed by Hazem Abdelghani.
keywords: smallscreen,largescreen,touch,clean,configurable,480p,1080p,16:9,16:10,4:3,5:3
